<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calculadora de Cotação de Sistemas</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <section class="attendance-bar" aria-labelledby="attendance-title">
      <div class="attendance-header">
        <h1 id="attendance-title" class="attendance-title">Assistente Comercial i3</h1>
        <span id="attendance-status" class="attendance-status">Tela 1 • Selecione um segmento</span>
      </div>
      <div class="attendance-tabs" role="tablist" aria-label="Canal de atendimento">
        <button id="tab-ativa" class="attendance-tab" type="button" role="tab" aria-selected="true" aria-controls="attendance-content" data-attendance-tab="ativa">Ligação Ativa</button>
        <button id="tab-recebida" class="attendance-tab" type="button" role="tab" aria-selected="false" aria-controls="attendance-content" data-attendance-tab="recebida" tabindex="-1">Ligação Recebida</button>
        <button id="tab-whatsapp" class="attendance-tab" type="button" role="tab" aria-selected="false" aria-controls="attendance-content" data-attendance-tab="whatsapp" tabindex="-1">WhatsApp</button>
        <button id="tab-presencial" class="attendance-tab" type="button" role="tab" aria-selected="false" aria-controls="attendance-content" data-attendance-tab="presencial" tabindex="-1">Presencial</button>
      </div>
      <div id="attendance-content" class="attendance-content" role="tabpanel" aria-live="polite" aria-labelledby="tab-ativa">
        <p id="attendance-text" class="attendance-text">Selecione um segmento abaixo para carregar o roteiro de abordagem comercial.</p>
        <button id="attendance-edit" class="attendance-edit" type="button" aria-label="Editar texto do Assistente Comercial i3" hidden>
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z" />
          </svg>
          <span>Editar texto</span>
        </button>
      </div>
    </section>

    <div class="main-grid">
      <main id="app-container" class="body simulator-panel" aria-label="Simulador de cotação"></main>

      <aside id="side-inspector" class="side-panel" aria-label="Detalhes dos módulos">
        <div id="inspector-content" hidden>
          <img id="insp-img" class="side-img" src="" alt="">
          <h2 id="insp-titulo" class="side-title"></h2>
          <p class="side-section"><strong>O que é:</strong> <span id="insp-oque"></span></p>
          <p class="side-section"><strong>Para que serve:</strong> <span id="insp-paraque"></span></p>
          <p class="side-section"><strong>Quando compensa:</strong> <span id="insp-quando"></span></p>
          <div class="pitch-box"><strong>Dica de venda</strong><p id="insp-pitch"></p></div>
        </div>
      </aside>
    </div>
  </div>
  <dialog id="share-dialog" class="share-dialog" aria-labelledby="share-dialog-title">
    <section class="share-dialog-panel">
      <header class="share-dialog-header">
        <div>
          <span class="share-dialog-eyebrow">Compartilhamento</span>
          <h2 id="share-dialog-title">Preparar mensagem</h2>
        </div>
        <button id="share-dialog-close" class="share-close" type="button" aria-label="Fechar janela">×</button>
      </header>
      <div id="meeting-quote-options" class="meeting-quote-options" role="group" aria-label="Cotações no convite" hidden>
        <button class="meeting-quote-option" type="button" data-meeting-quote="web" aria-pressed="false">Web</button>
        <button class="meeting-quote-option" type="button" data-meeting-quote="offline" aria-pressed="false">Offline</button>
        <button class="meeting-quote-option" type="button" data-meeting-quote="all" aria-pressed="true">Todos</button>
      </div>
      <div id="meeting-type-options" class="meeting-type-options" hidden>
        <span class="meeting-type-label">Tipo de reunião</span>
        <div class="meeting-quote-options" role="group" aria-label="Tipo de reunião">
          <button class="meeting-quote-option" type="button" data-meeting-type="video" aria-pressed="true">Video Chamada</button>
          <button class="meeting-quote-option" type="button" data-meeting-type="presencial" aria-pressed="false">Presencial</button>
        </div>
      </div>
      <div id="share-dialog-fields" class="share-dialog-fields"></div>
      <p id="share-dialog-status" class="share-dialog-status" role="status" aria-live="polite"></p>
      <footer class="share-dialog-actions">
        <button id="share-copy-all" class="btn-secondary" type="button">Copiar tudo</button>
        <button id="share-open-target" class="btn-primary" type="button">Abrir aplicativo</button>
      </footer>
    </section>
  </dialog>
  <dialog id="attendance-editor" class="attendance-editor" aria-labelledby="attendance-editor-title">
    <section class="attendance-editor-panel">
      <header class="attendance-editor-header">
        <div>
          <span class="attendance-editor-eyebrow">Assistente Comercial i3</span>
          <h2 id="attendance-editor-title">Editar texto do roteiro</h2>
        </div>
        <button id="attendance-editor-close" class="share-close" type="button" aria-label="Fechar janela">×</button>
      </header>
      <label class="attendance-editor-label" for="attendance-editor-value">Texto para esta tela e canal</label>
      <textarea id="attendance-editor-value" class="attendance-editor-value" rows="10"></textarea>
      <p id="attendance-editor-status" class="attendance-editor-status" role="status" aria-live="polite"></p>
      <footer class="attendance-editor-actions">
        <button id="attendance-editor-cancel" class="btn-secondary" type="button">Cancelar</button>
        <button id="attendance-editor-save" class="btn-primary" type="button">Salvar texto</button>
      </footer>
    </section>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
